# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - OfficeAschi

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, deploy-az]
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update ClientApp to latest
        run: git submodule update --remote --merge ClientApp

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ClientApp/package-lock.json

      - name: Install Angular dependencies
        run: npm ci
        working-directory: ClientApp

      - name: Build Angular app
        run: npm run build -- --configuration production
        working-directory: ClientApp

      - name: Check .NET SDK 10
        id: check-dotnet
        run: |
          $sdkList = dotnet --list-sdks 2>$null
          if ($sdkList -match '^10\.') {
            echo "installed=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "installed=false" >> $env:GITHUB_OUTPUT
          }
        shell: powershell

      - name: Set up .NET Core
        if: steps.check-dotnet.outputs.installed == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: dotnet publish
        run: dotnet publish OfficeAschiApi.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: "${{env.DOTNET_ROOT}}/myapp"

  deploy:
    runs-on: [self-hosted, deploy-az]
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Install Azure CLI
        run: |
          if (-not (Get-Command az -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Azure CLI..."
            $ProgressPreference = 'SilentlyContinue'
            Invoke-WebRequest -Uri https://aka.ms/installazurecliwindowsx64 -OutFile .\AzureCLI.msi
            Start-Process msiexec.exe -ArgumentList '/I', 'AzureCLI.msi', '/quiet', '/norestart' -Wait
            Remove-Item .\AzureCLI.msi
          } else {
            Write-Host "Azure CLI already installed"
          }
          # Persist PATH for all subsequent steps
          $cliPath = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin"
          echo $cliPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$cliPath;$env:PATH"
          az --version
        shell: powershell

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CC447A9438124F419B739EDD3F705E33 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8C43B637D3B84B11A8C9FA9E9D79A682 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F96D1E4AA15A453ABECCB053B2CD7713 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'OfficeAschi'
          slot-name: 'Production'
          package: .
          